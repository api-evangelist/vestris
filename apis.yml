name: Vestris
description: >-
  Vestris is an AI-powered platform that automates the real estate pre-closing
  process for mortgage title and closing operations. It uses browser agents to
  log into county tax portals, extract property records, parse purchase
  contracts, run tax calculations, generate title abstracts, and produce title
  commitments and closing documents. Positioned as "the AI processing unit for
  mortgage title and closing," Vestris aims to replace manual title searchers
  and accelerate property deal closing. The company is a Y Combinator (Summer
  2026) startup based in San Francisco. As of this profile it operates a
  product application (waitlist / demo access) with no publicly documented
  developer API, developer portal, SDKs, or webhook surface.
